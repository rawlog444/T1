name: MiTrixsRaR

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (default: from secrets)"
        required: false
      ts_api_key:
        description: "Tailscale API key (default: from secrets)"
        required: false
      ts_authkey:
        description: "Tailscale auth key (default: from secrets)"
        required: false
      gh_api_token:
        description: "GitHub Personal Access Token (default: from secrets)"
        required: false
      jazz_drive_url:
        description: "Direct Download Link for your Setup RAR file"
        required: false
        default: "https://cloud.jazzdrive.com.pk/sapi/download/file?action=get&k=KgIiNDVYnMaW-w2qZz2ICC9X_YZ-M7ecqbrNrh4vkfbiE_x0yZl1hY2OJiKfwPbPK8kxbSY_8lhmihhE5-w9NjzRA2U-5m7xHvR5MZA2mAc94vRJJXZf0y5rHBDLdXdxoCF5jZJi-ZWjcsONVKaWjfwbzKlrFOx_ol8WOEjl9Owl8IA0I6k&node=1i204&filename=Files.rar"
      test_mode:
        description: "Run 5-minute test loop"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime in minutes (max 360; capped to 355)"
        required: false
        default: "355"
      loops:
        description: "How many handoffs (0 = infinite)"
        required: false
        default: "0"

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

env:
  RDP_USER: runneradmin
  RDP_PASS: ${{ secrets.RDP_PASS }}
  TS_HOSTNAME: MiTrixs

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - name: 🔧 Resolve inputs & Mask Secrets
        id: cfg
        env:
          RAW_TAILNET:  ${{ inputs.ts_tailnet || secrets.TS_TAILNET }}
          RAW_APIKEY:   ${{ inputs.ts_api_key || secrets.TS_API_KEY }}
          RAW_AUTHKEY:  ${{ inputs.ts_authkey || secrets.TS_AUTHKEY }}
          RAW_PAT:      ${{ inputs.gh_api_token || secrets.GH_API_TOKEN }}
          RAW_TEST:     ${{ inputs.test_mode == true && 'true' || 'false' }}
          RAW_RUNTIME:  ${{ inputs.runtime_minutes || '355' }}
          RAW_LOOPS:    ${{ inputs.loops || '0' }}
          RAW_JAZZ:     ${{ inputs.jazz_drive_url }}
        run: |
          function ToIntOr($v, $def){ if("$v" -match '^\d+$'){[int]$v}else{[int]$def} }

          $tailnet = $env:RAW_TAILNET
          $apiKey  = $env:RAW_APIKEY
          $authKey = $env:RAW_AUTHKEY
          $pat     = $env:RAW_PAT
          if (-not $tailnet -or -not $apiKey -or -not $authKey -or -not $pat) {
            Write-Error "Missing required inputs/secrets"; exit 1
          }

          Write-Host "::add-mask::$apiKey"
          Write-Host "::add-mask::$authKey"
          Write-Host "::add-mask::$pat"

          $isTest = ($env:RAW_TEST -match '^(?i:true|1|yes|on)$')
          $runtime = ToIntOr $env:RAW_RUNTIME 355
          if ($isTest) { $runtime = 5 }
          if (-not $isTest -and $runtime -lt 6) { $runtime = 355 }
          if ($runtime -gt 360) { $runtime = 355 }
          $loops = ToIntOr $env:RAW_LOOPS 0
          if ($loops -lt 0) { $loops = 0 }

          "tailnet=$tailnet"   | Out-File -Append $env:GITHUB_OUTPUT
          "apikey=$apiKey"     | Out-File -Append $env:GITHUB_OUTPUT
          "authkey=$authKey"   | Out-File -Append $env:GITHUB_OUTPUT
          "pat=$pat"           | Out-File -Append $env:GITHUB_OUTPUT
          "runtime=$runtime"   | Out-File -Append $env:GITHUB_OUTPUT
          "loops=$loops"       | Out-File -Append $env:GITHUB_OUTPUT
          "jazzurl=$env:RAW_JAZZ" | Out-File -Append $env:GITHUB_OUTPUT

      - name: ⚙️ Install Tailscale
        run: |
          $exe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            $dst = "$env:TEMP\tailscale-setup-latest.exe"
            Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile $dst -UseBasicParsing
            Start-Process -FilePath $dst -ArgumentList "/quiet" -Wait
          }
          if (Test-Path $exe) {
            Start-Service Tailscale -ErrorAction SilentlyContinue
            & $exe version
          } else {
            Write-Error "Tailscale executable missing."
            exit 1
          }

      - name: 📦 Install Tools & Telegram
        run: |
          choco install -y 7zip winrar --no-progress
          winget install --id Telegram.TelegramDesktop -e --silent --accept-source-agreements --accept-package-agreements
          
          # Delete unnecessary SDKs to free disk space
          $paths = @($env:ANDROID_HOME, $env:ANDROID_NDK_HOME, "C:\cabal", "C:\ghc", "C:\julia")
          foreach ($p in $paths) {
            if ($p -and (Test-Path $p)) { Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue }
          }

      - name: 🚀 Optimize Windows Performance & Enable Dark Mode
        run: |
          # Stop unnecessary system background services
          'wuauserv','Spooler','WSearch','SysMain','DiagTrack','MapsBroker' | ForEach-Object { 
            Set-Service -Name $_ -StartupType Disabled -ErrorAction SilentlyContinue
            Stop-Service -Name $_ -Force -ErrorAction SilentlyContinue
          }

          # Improve RDP Performance & Enable Clipboard Sharing
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "DWMFrameRate" -PropertyType Dword -Value 60 -Force
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $tsPath)) { New-Item -Path $tsPath -Force | Out-Null }
          Set-ItemProperty -Path $tsPath -Name "fDisableClip" -Value 0 -Force

          # Disable Defender Realtime Monitoring
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer' -Name "SmartScreenEnabled" -Value "Off"

          # Apply System & App Dark Mode
          Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0 -Type Dword -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0 -Type Dword -ErrorAction SilentlyContinue

      - name: 🌐 Chrome Enterprise Policies (Disable Sign-in Prompts & Web Store Ext)
        run: |
          $chromePolicy = "HKLM:\SOFTWARE\Policies\Google\Chrome"
          if (-not (Test-Path $chromePolicy)) { New-Item -Path $chromePolicy -Force | Out-Null }

          # Completely disable sign-in popups, first run popups, and search selection prompts
          Set-ItemProperty -Path $chromePolicy -Name "PromoteFirstRunChoiceOption" -Value 0 -Force
          Set-ItemProperty -Path $chromePolicy -Name "HideFirstRunExperience" -Value 1 -Force
          Set-ItemProperty -Path $chromePolicy -Name "BrowserSignin" -Value 0 -Force
          Set-ItemProperty -Path $chromePolicy -Name "SearchEngineChoiceScreenEnabled" -Value 0 -Force

          # Force install webstore extensions
          $policyPath = "$chromePolicy\ExtensionInstallForcelist"
          if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }

          Set-ItemProperty -Path $policyPath -Name "1" -Value "iapifmceeokikomajpccajhjpacjmibe;https://clients2.google.com/service/update2/crx"
          Set-ItemProperty -Path $policyPath -Name "2" -Value "bgnkhhnnamicmpeenaelnjfhikgbkllg;https://clients2.google.com/service/update2/crx"

      - name: 🔐 Configure runneradmin Password & RDP Access
        env:
          PASS: ${{ env.RDP_PASS }}
        run: |
          net user runneradmin "$env:PASS"
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

      - name: 📥 Download Setup RAR & Configure Registry Auto-Launch
        run: |
          $url = "${{ steps.cfg.outputs.jazzurl }}"
          $extractDir = "C:\SetupTools"
          $rarPath = "$extractDir\Files.rar"
          
          $userDesktop = "C:\Users\Public\Desktop"
          $userStartup = "C:\Users\runneradmin\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          New-Item -ItemType Directory -Path $userDesktop -Force | Out-Null
          New-Item -ItemType Directory -Path $userStartup -Force | Out-Null

          # 1. Download RAR directly to SetupTools
          Write-Host "Downloading RAR from Jazz Drive to SetupTools..."
          Invoke-WebRequest -Uri $url -OutFile $rarPath -UserAgent "Mozilla/5.0" -UseBasicParsing

          # Copy RAR file to Desktop for easy access
          Copy-Item -Path $rarPath -Destination "$userDesktop\Files.rar" -Force

          # 2. Extract using 7-Zip
          $7z = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $7z)) { $7z = "7z" }
          
          Write-Host "Extracting RAR archive..."
          & $7z x "$rarPath" -o"$extractDir" -y

          # 3. Copy JSON Config to Desktop
          $jsonSrc = Get-ChildItem -Path $extractDir -Filter "*.json" -Recurse | Select-Object -First 1
          if ($jsonSrc) {
            Copy-Item -Path $jsonSrc.FullName -Destination "$userDesktop\" -Force
            Write-Host "Copied AutoClicker JSON config to Desktop."
          }

          # 4. Configure Local Chrome Extensions
          $chromeExe = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          
          $ext1 = Get-ChildItem -Path $extractDir -Directory -Recurse | Where-Object { $_.Name -like "*animephahe downloader*" } | Select-Object -First 1
          $ext2 = Get-ChildItem -Path $extractDir -Directory -Recurse | Where-Object { $_.Name -like "*Animephahe Episodes*" } | Select-Object -First 1
          $ext3 = Get-ChildItem -Path $extractDir -Directory -Recurse | Where-Object { $_.Name -like "*yt downloader*" } | Select-Object -First 1

          $extPaths = @()
          if ($ext1) { $extPaths += $ext1.FullName }
          if ($ext2) { $extPaths += $ext2.FullName }
          if ($ext3) { $extPaths += $ext3.FullName }

          $loadExtArg = if ($extPaths.Count -gt 0) { "--load-extension=`"$($extPaths -join ',')`"" } else { "" }
          $chromeFlags = "--no-first-run --no-default-browser-check --disable-search-engine-choice-screen $loadExtArg"

          # Create Desktop Shortcut for Chrome with local extensions
          $wsh = New-Object -ComObject WScript.Shell
          $shortcut = $wsh.CreateShortcut("$userDesktop\Google Chrome.lnk")
          $shortcut.TargetPath = $chromeExe
          $shortcut.Arguments = $chromeFlags
          $shortcut.Save()

          # 5. Create Batch Script & Hook into Registry Run Key
          $cmdBatch = "$extractDir\on_login.bat"
          $idmInstaller = Get-ChildItem -Path $extractDir -Filter "idman*.exe" -Recurse | Select-Object -First 1
          $idmPatch = Get-ChildItem -Path $extractDir -Filter "*Crack*.exe" -Recurse | Select-Object -First 1

          $batchContent = "@echo off`r`n"
          if ($idmInstaller) {
            $batchContent += "echo Installing IDM...`r`n"
            $batchContent += "start `"`" /wait `"$($idmInstaller.FullName)`" /s`r`n"
          }
          if ($idmPatch) {
            $batchContent += "echo Applying Patch...`r`n"
            $batchContent += "start `"`" `"$($idmPatch.FullName)`"`r`n"
          }
          $batchContent += "start `"`" `"$chromeExe`" $chromeFlags`r`n"

          Set-Content -Path $cmdBatch -Value $batchContent -Force

          # Double-trigger setup: Register in Registry Run Key + Startup folder
          Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'AutoSetup' -Value "`"$cmdBatch`"" -Force
          Copy-Item -Path $cmdBatch -Destination "$userStartup\on_login.bat" -Force
          
          Write-Host "Login automation script registered successfully."

      - name: 🧹 Purge devices (Startup)
        run: |
          $hdr = @{ Authorization = "Bearer ${{ steps.cfg.outputs.apikey }}" }
          $tn  = [uri]::EscapeDataString("${{ steps.cfg.outputs.tailnet }}")
          try {
            $resp = Invoke-RestMethod -Method GET -Headers $hdr -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
            foreach ($d in $resp.devices) {
              if (($d.name -match '(?i)mitrixs') -or ($d.hostname -match '(?i)mitrixs')) {
                Invoke-RestMethod -Method DELETE -Headers $hdr -Uri ("https://api.tailscale.com/api/v2/device/{0}" -f $d.id) | Out-Null
              }
            }
          } catch {}

      - name: 🔗 Tailscale Up
        id: up
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts logout | Out-Null
          & $ts up --authkey "${{ steps.cfg.outputs.authkey }}" --hostname "${{ env.TS_HOSTNAME }}" --accept-routes --accept-dns=false
          Start-Sleep -Seconds 2

          $ip4 = (& $ts ip -4 | Select-Object -First 1)
          "### RDP Access`nHost: $env:TS_HOSTNAME`nIPv4: $ip4`nUser: $env:RDP_USER" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: ⏳ Keep alive
        run: |
          $mins = [int]"${{ steps.cfg.outputs.runtime }}"
          $end = (Get-Date).AddMinutes($mins)
          while ((Get-Date) -lt $end) {
            $ts = $end - (Get-Date)
            $formatted = "{0:D2}h:{1:D2}m remaining" -f [int][math]::Floor($ts.TotalHours), [int]$ts.Minutes
            Write-Host "⏳ RDP Active | Time Left: $formatted"
            Start-Sleep -Seconds 180
          }

      - name: 🧹 Purge devices (Exit)
        if: always()
        run: |
          $hdr = @{ Authorization = "Bearer ${{ steps.cfg.outputs.apikey }}" }
          $tn  = [uri]::EscapeDataString("${{ steps.cfg.outputs.tailnet }}")
          try {
            $resp = Invoke-RestMethod -Method GET -Headers $hdr -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
            foreach ($d in $resp.devices) {
              if (($d.name -match '(?i)mitrixs') -or ($d.hostname -match '(?i)mitrixs')) {
                Invoke-RestMethod -Method DELETE -Headers $hdr -Uri ("https://api.tailscale.com/api/v2/device/{0}" -f $d.id) | Out-Null
              }
            }
          } catch {}
